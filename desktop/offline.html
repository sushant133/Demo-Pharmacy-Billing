<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MantraMed - No connection</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; color: #0f172a;
    font: 16px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 24rem; }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px; background: #0f766e;
    color: #fff; font-size: 30px; font-weight: 700;
  }
  h1 { font-size: 1.15rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #475569; font-size: 0.9rem; }
  button {
    border: 0; border-radius: 10px; padding: 12px 24px; cursor: pointer;
    background: #0f766e; color: #fff; font: inherit; font-weight: 600;
  }
  button:hover { background: #115e59; }
</style>
<div class="card">
  <div class="mark">M</div>
  <h1>Can&rsquo;t reach MantraMed</h1>
  <p>The app needs an internet connection to load sales, stock and batches. Check the connection and try again.</p>
  <button id="retry">Try again</button>
</div>
<script>
  // main.js passes the server address as ?url=
  const target = new URLSearchParams(location.search).get("url");
  const retry = () => { if (target) location.href = target; };
  document.getElementById("retry").addEventListener("click", retry);
  // Come back on our own once the connection returns.
  window.addEventListener("online", retry);
</script>
